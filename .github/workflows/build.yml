name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests-linux:
    # Core is platform-independent — keep it that way (future macOS/Linux front ends).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - name: Core tests
        run: dotnet run --project tests/ClipboardManager.Core.Tests -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, test, publish and package
        shell: pwsh
        # Store identity comes from repository variables (Settings > Secrets and variables > Actions > Variables),
        # copied from Partner Center > Product identity. Without them the MSIX uses local-test defaults.
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: ./build.ps1 -Publish -Installer -Msix
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-portable-win-x64
          path: publish/ClipboardManager.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-Setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-msix
          path: dist/*.msix
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/ClipboardManager.exe
            dist/*.exe
            dist/*.msix
          generate_release_notes: true

