name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests-linux:
    # Core is platform-independent — keep it that way (future macOS/Linux front ends).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsqlite3-0 sqlite3
      - name: Core tests
        run: |
          dotnet run --project tests/ClipboardManager.Core.Tests -c Release > test_out.txt 2>&1 || true
          cat test_out.txt
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: test_out.txt
      - name: Check test results
        run: |
          if grep -q "FAIL" test_out.txt; then
            while IFS= read -r line; do
              echo "::error title=Test Failure::$line"
            done < <(grep "FAIL" test_out.txt)
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, test, publish and package
        shell: pwsh
        # Store identity comes from repository variables (Settings > Secrets and variables > Actions > Variables),
        # copied from Partner Center > Product identity. Without them the MSIX uses local-test defaults.
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: ./build.ps1 -Publish -Installer -Msix
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-portable-win-x64
          path: publish/ClipboardManager.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-Setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-msix
          path: dist/*.msix
      - name: Create GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/ClipboardManager.exe
            dist/*.exe
            dist/*.msix
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and package macOS bundles (.app)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.0"
          fi
          chmod +x packaging/mac/build-mac.sh
          ./packaging/mac/build-mac.sh osx-arm64 "$VERSION"
          ./packaging/mac/build-mac.sh osx-x64 "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-macOS-arm64
          path: |
            dist/AdvancedClipboardManager-osx-arm64.dmg
            dist/AdvancedClipboardManager-osx-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-macOS-x64
          path: |
            dist/AdvancedClipboardManager-osx-x64.dmg
            dist/AdvancedClipboardManager-osx-x64.zip
      - name: Attach macOS packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdvancedClipboardManager-osx-arm64.dmg
            dist/AdvancedClipboardManager-osx-arm64.zip
            dist/AdvancedClipboardManager-osx-x64.dmg
            dist/AdvancedClipboardManager-osx-x64.zip


