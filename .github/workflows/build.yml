name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests-linux:
    # Core is platform-independent — keep it that way (future macOS/Linux front ends).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - name: Core tests
        run: dotnet run --project tests/ClipboardManager.Core.Tests -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardManager-win-x64
          path: publish/
